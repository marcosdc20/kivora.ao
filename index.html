    <!-- Preloader Styles: Modern Minimalist Light Theme with Fixed Proportions -->
    <style>
      @keyframes kivora-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #initial-loader, #initial-loader * {
        box-sizing: border-box;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        background-color: #ffffff;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .kivora-loader-card {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 240px;
      }
      .kivora-loader-logo-wrapper {
        width: 180px;
        height: 50px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .kivora-loader-logo {
        max-width: 180px;
        max-height: 50px;
        width: auto;
        height: 50px;
        display: block;
        object-fit: contain;
      }
      .kivora-loader-spinner {
        width: 44px;
        height: 44px;
        border: 3.5px solid #f1f5f9;
        border-top-color: #f59e0b;
        border-right-color: #f59e0b;
        border-radius: 50%;
        animation: kivora-spin 0.85s linear infinite;
        margin-bottom: 14px;
        flex-shrink: 0;
      }
      .kivora-loader-text {
        color: #64748b;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.3px;
        margin: 0;
      }
    </style>
